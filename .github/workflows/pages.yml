name: Publish browser edition
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify Python and browser engines
        run: |
          python -m unittest discover -s tests
          node --test tests/browser-client.test.cjs
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build credential-free public assets
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_pages.py --site-url "$SITE_URL"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
