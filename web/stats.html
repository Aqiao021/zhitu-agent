<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>试用统计 · 职途助手</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1B33">
<link rel="stylesheet" href="styles.css">
</head>
<body class="stats-page">
<header class="nav scrolled"><div class="nav-inner">
  <a class="brand" href="/"><svg class="brand-mark" viewBox="64 64 896 896" aria-hidden="true"><rect x="64" y="64" width="896" height="896" rx="152" fill="currentColor"/><path d="M224 764L368 620H464L592 468H680L800 328" fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><circle cx="800" cy="328" r="50" fill="#FFC56B"/></svg><span class="brand-name">试用统计</span></a>
  <div class="nav-right"><a class="btn btn-ghost btn-sm static-only" href="index.html">返回工具</a><a id="csv" class="btn btn-primary btn-sm" href="/stats.csv">导出 CSV</a></div>
</div></header>
<main class="container" style="padding-top:40px;padding-bottom:80px">
  <p class="eyebrow">Usage</p>
  <h2 id="statsTitle">试用数据</h2>
  <p class="muted" id="statsHelp">只统计接入真实模型后的使用（演示模式不计入）；不含任何简历或招聘信息内容。</p>
  <div class="static-only browser-notice">这些是当前浏览器的记录，不是全站统计。请及时导出；清除浏览器数据后无法恢复。<p><button id="exportRaw" type="button" class="btn btn-ghost btn-sm">备份原始记录</button> <button id="clearLocal" type="button" class="btn btn-ghost btn-sm">清除本机数据</button></p></div>
  <div id="err" class="need hidden"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h3>各功能使用情况</h3><div class="tbl"><table id="events"></table></div></div>
  <div class="card"><h3>用户评分</h3><div class="tbl"><table id="fb"></table></div></div>
  <div class="card"><h3>最近的文字反馈</h3><ul id="comments" class="clist"></ul></div>
  <div class="card server-only" id="jobAdmin">
    <h3>岗位库管理</h3>
    <p class="muted small">同学提交的真实招聘先在这里审核：点“整理预览”由模型整理成岗位画像，确认无误后入库，前台会标注“真实招聘”。提交内容已自动隐藏手机号、邮箱等信息，入库前请再检查一遍有没有公司内部或个人信息。</p>
    <h4>待审核的提交</h4>
    <div id="subs" class="subs"></div>
    <h4>直接粘贴一条招聘</h4>
    <div class="field"><textarea id="aText" placeholder="岗位名称、岗位职责、任职要求……" style="min-height:160px"></textarea></div>
    <input class="input" id="aUrl" placeholder="原链接（可选）https://" maxlength="300" style="margin-top:8px">
    <p><button class="btn btn-primary btn-sm" id="aExtract" type="button">整理预览</button></p>
    <div id="preview"></div>
    <h4>已入库的真实招聘</h4>
    <div id="imported" class="subs"></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script src="browser-client.js"></script>
<script src="stats.js"></script>
</body>
</html>
